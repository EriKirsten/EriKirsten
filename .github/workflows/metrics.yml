name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: EriKirsten/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: EriKirsten
          filename: github-metrics.svg
